<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Guest list – Kate &amp; David</title>
<meta name="theme-color" content="#F6F1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..600;1,300..600&family=Tangerine&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="wrap">
  <p class="sig">Kate &amp; David</p>

  <!-- Login -->
  <section id="login" hidden>
    <h1>Couple login</h1>
    <form id="loginForm" novalidate>
      <label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="lPass" type="password" autocomplete="current-password" required></label>
      <button type="submit" id="lBtn">Log in</button>
      <p class="msg" id="lMsg" role="alert"></p>
    </form>
    <a class="back" href="index.html">← Back to the invitation</a>
  </section>

  <!-- Guest list -->
  <section id="app" hidden>
    <div class="bar">
      <h1>Guest list</h1>
      <button class="ghost" id="logout" type="button">Log out</button>
    </div>
    <form id="addForm" class="card" novalidate>
      <h2>Add a guest or couple</h2>
      <label>Name<input id="aName" type="text" maxlength="120" placeholder="e.g. Anna &amp; Tom Brown" required></label>
      <label>Email<input id="aEmail" type="email" maxlength="254" placeholder="anna@example.com" required></label>
      <button type="submit" id="aBtn">Add to list</button>
      <p class="msg" id="aMsg" role="alert"></p>
    </form>
    <div class="bar sub">
      <p id="count" class="count"></p>
      <button class="ghost" id="export" type="button">Export CSV</button>
    </div>
    <p class="msg" id="listMsg" role="alert"></p>
    <ul id="list" class="list"></ul>
    <a class="back" href="index.html">← Back to the invitation</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
